<meta charset="utf-8">
<script>
if(!document.documentElement.lang)document.documentElement.lang="pt-BR";// hifenização do texto justificado
/* reconhece o aparelho pelo tamanho da tela física e decide o layout (antes de desenhar a página) */
(function(){const R=document.documentElement;
  function decide(){const w=innerWidth,coarse=matchMedia("(pointer:coarse)").matches,
      ipad=/iPad|Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1,
      big=Math.min(screen.width,screen.height)>=700;let L,c="1";
    if(coarse||ipad)L=big&&w>=480?"tablet":"phone";else L=w<700?"phone":w>=1024?"desktop":"compact";
    if((L==="tablet"&&w>=1000)||(L==="desktop"&&w>=1200))c="2";
    if(R.dataset.layout!==L)R.dataset.layout=L;if(R.dataset.cols!==c)R.dataset.cols=c}
  decide();addEventListener("resize",decide);addEventListener("orientationchange",()=>setTimeout(decide,120));window.__decideLayout=decide})();
/* medição da abertura (11/2026): guarda as últimas 12 aberturas em resid-perf (Configurações › Tempo de abertura).
   ok = a saudação do Início com conteúdo; sw = arquivos vindos do modo offline; app = aberto pelo ícone (instalado) */
(function(){if(!window.performance||!performance.now)return;const sw=!!(navigator.serviceWorker&&navigator.serviceWorker.controller),
    app=!!(navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)),t0=Date.now();
  function done(ok){try{const n=performance.getEntriesByType&&performance.getEntriesByType("navigation")[0],f=performance.getEntriesByName&&performance.getEntriesByName("first-contentful-paint")[0],
      r={at:t0,ok:Math.round(ok),fcp:f?Math.round(f.startTime):0,dcl:n?Math.round(n.domContentLoadedEventEnd):0,sw:sw?1:0,app:app?1:0,kb:n&&n.transferSize?Math.round(n.transferSize/1024):0};
    const L=JSON.parse(localStorage.getItem("resid-perf")||"[]");L.unshift(r);localStorage.setItem("resid-perf",JSON.stringify(L.slice(0,12)))}catch(e){}}
  (function tick(){const h=document.getElementById("iHero");if(h&&h.firstChild)return done(performance.now());if(performance.now()<30000)requestAnimationFrame(tick)})()})();
</script>
<title>Nexus - Trilha Médica</title>
